# Read by tools/gameconf.py (the analysis tools) and the Makefile.
[game]
title = Star Wars: A New Hope for Homebrew
ghidra_project = StarWars
original_sha1 = 696473098a54fa3fca2db8016527f6f935c4a95b
# the game's own code in .text; the rest is XDK library code
app_ranges = 0x00011000-0x0002A442
rdata = 0x000B5F60-0x000BA538
